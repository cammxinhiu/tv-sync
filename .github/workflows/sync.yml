name: Sync JSON

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python sync.py
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add hoiquan.json
          git diff --staged --quiet || git commit -m "sync"
          git push
