name: Sync JSON

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-sync]

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests
      - name: Sync Hội Quán
        run: python sync.py
      - name: Convert M3U sang JSON
        run: python convert_m3u.py
      - name: Push changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add hoiquan.json multisource.json
          git diff --staged --quiet || git commit -m "sync: $(date -u '+%Y-%m-%d %H:%M')"
          git push
