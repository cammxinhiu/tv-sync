name: Sync JSON
on:
  repository_dispatch:
    types: [trigger-sync]   # Đây là "mật khẩu" để nhận lệnh từ cron-job
  workflow_dispatch:        # Giữ lại nút chạy bằng tay để sếp test
jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests
      - name: Run sync script
        run: python sync.py
      - name: Push changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add hoiquan.json
          git diff --staged --quiet || git commit -m "sync"
          git push
